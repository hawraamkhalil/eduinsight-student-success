name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall -q src app.py pages tests

      - name: Run automated tests
        run: |
          python -m pytest -q

      - name: Validate deployment artifacts
        run: |
          python -c "from pathlib import Path; assert Path('data/processed/student_features.csv').is_file(), 'Processed dataset is missing'"
          python -c "from pathlib import Path; assert Path('models/early_support_model.joblib').is_file(), 'Model artifact is missing'"
          python -c "from pathlib import Path; from src.model_training import load_model_artifact; artifact = load_model_artifact(Path('models/early_support_model.joblib')); assert artifact['feature_columns']; print('Model artifact validation passed')"